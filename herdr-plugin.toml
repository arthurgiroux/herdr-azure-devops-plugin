id = "arthurgiroux.azure-devops"
name = "Azure DevOps"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Azure DevOps integration for herdr, starting with live build status for the workspace repo and branch"
platforms = ["macos", "linux"]

[[actions]]
id = "builds"
title = "Show Azure DevOps builds"
contexts = ["workspace"]
command = ["python3", "-m", "azure_devops", "builds"]

[[panes]]
id = "builds"
title = "Azure DevOps builds"
placement = "split"
command = ["python3", "-m", "azure_devops", "watch"]


[[build]]
command = ["python3", "-c", "import sys; sys.exit(0 if sys.version_info >= (3, 11) else 'herdr-azure-devops-plugin requires Python 3.11 or later')"]
